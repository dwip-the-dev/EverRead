<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#f8f6f0"/>
  <defs>
    <radialGradient id="glow" cx="256" cy="256" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4a04e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4a04e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="120" fill="url(#glow)"/>
  <!-- Open book -->
  <g transform="translate(256,256)" fill="none" stroke="#332a24" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-8,-60 L-8,-60 Q-8,-60 -8,-60 L-100,-40 Q-110,-37 -110,-26 L-110,55 Q-110,66 -100,63 L-8,43"/>
    <!-- Right page -->
    <path d="M8,-60 L8,-60 Q8,-60 8,-60 L100,-40 Q110,-37 110,-26 L110,55 Q110,66 100,63 L8,43"/>
    <!-- Spine -->
    <path d="M0,-65 L0,48" stroke-width="10"/>
    <!-- Left page lines -->
    <line x1="-85" y1="-15" x2="-25" y2="-28" stroke-width="5" opacity="0.2"/>
    <line x1="-85" y1="5" x2="-25" y2="-8" stroke-width="5" opacity="0.2"/>
    <line x1="-85" y1="25" x2="-25" y2="12" stroke-width="5" opacity="0.2"/>
    <!-- Right page lines -->
    <line x1="85" y1="-15" x2="25" y2="-28" stroke-width="5" opacity="0.2"/>
    <line x1="85" y1="5" x2="25" y2="-8" stroke-width="5" opacity="0.2"/>
    <line x1="85" y1="25" x2="25" y2="12" stroke-width="5" opacity="0.2"/>
  </g>
</svg>